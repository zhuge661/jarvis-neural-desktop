name: Build and test macOS
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target CPU architecture
        required: true
        default: both
        type: choice
        options: [both, arm64, x64]
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'arm64' && '[{"arch":"arm64","runner":"macos-15"}]' || inputs.arch == 'x64' && '[{"arch":"x64","runner":"macos-15-intel"}]' || '[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install chromium
      - run: python scripts/check_public.py
      - run: node tests/gestures.cjs && node tests/desktop_boot.cjs
      - run: python -B tests/integration.py
      - name: Prepare Intel CI graphics loader
        if: matrix.arch == 'x64'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install vulkan-loader
          echo "JARVIS_CI_VULKAN_LOADER=$(brew --prefix vulkan-loader)/lib" >> "$GITHUB_ENV"
      - run: python -B scripts/build_mac.py --arch ${{ matrix.arch }} --sign --smoke
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/
            test-results/
          if-no-files-found: ignore
          compression-level: 0
